name: TestNG CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]  # This triggers on PRs to main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run TestNG Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run Tests with TestNG
        run: mvn clean test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: testng-reports
          path: |
            target/surefire-reports/
            test-output/

      - name: Test Summary
        run: |
          echo "📊 TESTNG TEST RESULTS"
          echo "======================"
          echo "✅ Tests completed successfully"

  # This job specifically checks PR status
  pr-check:
    runs-on: ubuntu-latest
    name: PR Quality Gate
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Check test results
        run: |
          echo "✅ PR QUALITY GATE PASSED"
          echo "========================="
          echo "All tests passed successfully"
          echo "This PR is ready to merge!"